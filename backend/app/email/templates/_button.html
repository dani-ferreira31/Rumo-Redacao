{% macro button(url, label) -%}
<p style="margin:24px 0;">
  <a href="{{ url }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;font-weight:bold;">{{ label }}</a>
</p>
<p style="font-size:13px;color:#64748b;">Se o botão não funcionar, copie e cole este link no navegador:<br /><a href="{{ url }}" style="color:#4f46e5;word-break:break-all;">{{ url }}</a></p>
{%- endmacro %}
