<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;">
            <tr>
              <td style="padding:24px 32px 0 32px;font-size:20px;font-weight:bold;color:#4338ca;">Rumo1000</td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px 32px;font-size:16px;line-height:1.5;">
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
          <p style="font-size:12px;color:#64748b;margin:16px 0 0 0;">
            {% block footer %}Você recebeu este e-mail porque tem uma conta no Rumo1000.{% endblock %}
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
