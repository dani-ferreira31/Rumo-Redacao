[project]
name = "rumo1000-backend"
version = "0.1.0"
description = "API e worker da plataforma Rumo1000"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "pydantic>=2",
  "pydantic-settings",
  "python-multipart",
  "argon2-cffi",
  "pyjwt",
  "email-validator",
  "jinja2",
  "resend",
  "slowapi",
  "anthropic",
  "opencv-python-headless",
  "numpy",
  "pillow",
  "pillow-heif",
  "openai",
  "google-genai",
  "cryptography",
  "pypdfium2",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "time-machine",
  "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008", "UP046"]
