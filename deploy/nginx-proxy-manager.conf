# Cole no Nginx Proxy Manager: Proxy Host rumo.4bsistemas.com.br → aba "Advanced".
# O "Forward" da aba Details aponta para o frontend (rumo1000-frontend:3000);
# aqui /api/* e /health vão para o backend.
# Os nomes ficam em variáveis para o nginx resolver na hora da requisição:
# assim o NPM não quebra se o backend estiver fora do ar quando ele recarregar.

# fotos de redação podem ter até 10 MB cada (2 por envio)
client_max_body_size 25m;

location /api/ {
    set $rumo_api rumo1000-backend;
    proxy_pass http://$rumo_api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # IP real do aluno vem do Cloudflare (usado no rate limit)
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_read_timeout 120s;
}

location = /health {
    set $rumo_api rumo1000-backend;
    proxy_pass http://$rumo_api:8000;
    proxy_set_header Host $host;
}
