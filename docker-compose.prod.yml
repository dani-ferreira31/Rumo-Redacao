# Produção na VPS. Uso:
#   cp .env.prod.example .env.prod   (e preencha)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Guia completo: deploy/README.md
name: rumo1000

x-backend: &backend
  build:
    context: ./backend
    target: prod
  env_file: .env.prod
  restart: unless-stopped
  volumes:
    - storage:/data/storage
    - ./data:/app/data:ro          # dados de importação (questões, calibração)
  depends_on:
    postgres:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # sem portas publicadas: o banco só é acessível pela rede interna do compose

  backend:
    <<: *backend
    # aplica as migrations antes de subir a API (uma instância só)
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
             --proxy-headers --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: python -m app.worker

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      TZ: America/Sao_Paulo
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - storage:/data/storage:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
